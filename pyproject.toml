[project]
name = "modbus2mqtt"
version = "2.0.0b2"
description = "Bridge from Modbus to MQTT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["paho-mqtt==2.1.0", "tmodbus[async-serial]>=1.1,<2"]

[project.scripts]
modbus2mqtt = "modbus2mqtt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modbus2mqtt"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "tmodbus>=1.1,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
